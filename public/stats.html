<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Target Analytics | Url-Wrapper</title>
  <link rel="manifest" href="/manifest.json">
  <script src="/sw-register.js" defer></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 850px;
    }
    header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 26px; }
    p.subtitle { color: var(--muted); margin: 4px 0 0 0; font-size: 14px; }
    
    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    
    .controls-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 240px;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    select {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #2563eb; }

    /* Key Metric Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .metric-box {
      background: #020617;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .metric-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent);
      margin: 8px 0 4px 0;
    }

    .metric-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .target-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .target-url-highlight {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>URL Telemetry & Stats</h1>
        <p class="subtitle">Performance reporting for wrapped destination links</p>
      </div>
    </header>

    <!-- Search & Range Control Panel -->
    <div class="card">
      <div class="controls-row">
        <input 
          type="text" 
          id="targetInput" 
          placeholder="Enter target domain or URL (e.g. dailyrosary.cf)" 
          onkeydown="if(event.key === 'Enter') loadStats()"
        />
        <select id="timeRange" onchange="loadStats()">
          <option value="7d">Last 7 days</option>
          <option value="30d" selected>Last 30 days</option>
          <option value="this_month">This month</option>
          <option value="this_year">This year</option>
          <option value="365d">Last 365 days</option>
        </select>
        <button onclick="loadStats()">View Stats</button>
      </div>
    </div>

    <!-- Metrics Results Panel -->
    <div id="resultsCard" class="card" style="display: none;">
      <div class="target-header">
        Metrics for <span id="displayTarget" class="target-url-highlight"></span>
      </div>

      <div class="metrics-grid">
        <!-- Impressions -->
        <div class="metric-box">
          <div class="metric-title">Impressions</div>
          <div class="metric-val" id="val-impressions">0</div>
          <div class="metric-sub">Times shown on the network</div>
        </div>

        <!-- Clicks -->
        <div class="metric-box">
          <div class="metric-title">Clicks</div>
          <div class="metric-val" id="val-clicks">0</div>
          <div class="metric-sub">Visits driven to your site</div>
        </div>

        <!-- CTR -->
        <div class="metric-box">
          <div class="metric-title">CTR</div>
          <div class="metric-val" id="val-ctr">0.0%</div>
          <div class="metric-sub">Click-through rate</div>
        </div>

        <!-- Rank -->
        <div class="metric-box">
          <div class="metric-title">Rank</div>
          <div class="metric-val" id="val-rank">#-</div>
          <div class="metric-sub">By overall network traffic</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadStats() {
      const target = document.getElementById('targetInput').value.trim();
      const range = document.getElementById('timeRange').value;
      const resultsCard = document.getElementById('resultsCard');

      if (!target) return;

      try {
        const res = await fetch(`/api/stats-json?target=${encodeURIComponent(target)}&range=${range}`);
        const data = await res.json();

        if (data.metrics) {
          const m = data.metrics;
          document.getElementById('displayTarget').innerText = m.target;
          document.getElementById('val-impressions').innerText = m.impressions.toLocaleString();
          document.getElementById('val-clicks').innerText = m.clicks.toLocaleString();
          document.getElementById('val-ctr').innerText = m.ctr;
          document.getElementById('val-rank').innerText = m.rank;

          resultsCard.style.display = 'block';
        }
      } catch (err) {
        console.error('Error fetching statistics:', err);
      }
    }

    // Auto-load if path includes target (/stats/https://dailyrosary.cf)
    window.addEventListener('DOMContentLoaded', () => {
      const path = window.location.pathname;
      if (path.startsWith('/stats/')) {
        const urlTarget = path.replace('/stats/', '');
        if (urlTarget) {
          document.getElementById('targetInput').value = decodeURIComponent(urlTarget);
          loadStats();
        }
      }
    });
  </script>
</body>
</html>
