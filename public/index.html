<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Url-Wrapper | Transparent Redirect Engine</title>
  <link rel="manifest" href="/manifest.json">
  <script src="/sw-register.js" defer></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 600px;
      background: var(--card);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.025em;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 16px;
      margin-bottom: 28px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    input[type="url"] {
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus {
      border-color: var(--accent);
    }
    button {
      padding: 14px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    .result-box {
      display: none;
      background: #020617;
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      word-break: break-all;
      font-family: monospace;
      font-size: 14px;
      color: #38bdf8;
      text-align: left;
    }
    .nav-links {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .nav-links a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Url-Wrapper</h1>
    <p>Prepend this wrapper domain to any target URL to trigger background GA4 analytics while executing a seamless HTTP 302 redirect.</p>

    <div class="input-group">
      <input type="url" id="target-input" placeholder="https://subdomain.example.com/file.mp3" required>
      <button onclick="generateWrapperUrl()">Generate Wrapped URL</button>
    </div>

    <div id="result" class="result-box"></div>

    <div class="nav-links">
      <a href="/stats">Service Dashboard</a>
      <a href="/health">Health Check</a>
    </div>
  </div>

  <script>
    function generateWrapperUrl() {
      const input = document.getElementById('target-input').value.trim();
      const resultBox = document.getElementById('result');

      if (!input || !/^https?:\/\//i.test(input)) {
        alert('Please enter a valid HTTP or HTTPS URL.');
        return;
      }

      const wrappedUrl = `${window.location.origin}/go/${input}`;
      resultBox.style.display = 'block';
      resultBox.innerHTML = `<strong>Wrapped URL:</strong><br><a href="${wrappedUrl}" target="_blank" style="color:#38bdf8">${wrappedUrl}</a>`;
    }
  </script>
</body>
</html>
